<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | VisitHub</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <a class="brand auth-brand" href="index.html">Visit<span>Hub</span></a>
    <section class="auth-card">
      <a class="back-link" href="index.html">← Volver al inicio</a>
      <span class="eyebrow">BIENVENIDO/A DE NUEVO</span>
      <h1>Iniciar sesión</h1>
      <p class="auth-intro">Accede para consultar y gestionar tus solicitudes.</p>

      <form id="login-form" class="auth-form">
        <label for="email">Correo electrónico</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="tu@correo.com" required>

        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Tu contraseña" required>

        <p id="form-message" class="form-message" role="status" aria-live="polite"></p>
        <button class="button button-primary button-full" type="submit">Entrar</button>
      </form>

      <p class="auth-switch">¿Todavía no tienes cuenta? <a href="register.html">Regístrate</a></p>
      <p class="auth-footnote">Recomendamos encarecidamente no poner información sensible en los registros por la pólitica de privacidad.</p>
    </section>
    <p class="auth-footnote">VisitHub · Tu espacio de visitas</p>
  </main>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
